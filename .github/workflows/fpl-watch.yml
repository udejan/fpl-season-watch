name: FPL Season Watcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Posalji probni mejl (za testiranje SMTP podesavanja), umesto stvarne provere"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fpl-season-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run FPL season check
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: python fpl_watch.py

      - name: Commit updated state
        run: |
          git config user.name "fpl-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "Update FPL season watch state"
            git pull --rebase --autostash origin main
            git push
          else
            echo "No state changes to commit."
          fi
